name: Stock Yard Screener

on:
  workflow_dispatch:
  schedule:
    # IST Market Hours: 9:15 AM - 3:30 PM IST = 3:45 AM - 10:00 AM UTC
    - cron: '0,15,30,45 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'

permissions:
  contents: write

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pandas yfinance requests numpy scipy

    - name: Run trendline scanner
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "Running trendline scanner..."
        python update_feed.py || echo "Scanner completed with errors"
        python update_trendline_prices_live.py || echo "Live prices completed"

    - name: Push data files to Stock-Yard-Public
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        # Clone the public repo
        git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/anuragsin17-sketch/Stock-Yard-Public.git public_repo

        # Copy only data files — NEVER index.html
        cp -f trendline_screen.json public_repo/trendline_screen.json || true
        cp -f data.json             public_repo/data.json             || true
        cp -f alerted_today.json    public_repo/alerted_today.json    || true

        # Commit and push
        cd public_repo
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add trendline_screen.json data.json alerted_today.json
        git diff --staged --quiet || git commit -m "data: screener update $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
        echo "✅ Data files pushed to Stock-Yard-Public"

    - name: Save state to backend repo
      run: |
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add trendline_screen.json alerted_today.json previous_stocks.json angel_orders.json || true
        git diff --staged --quiet || git commit -m "state: screener run $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
