name: Deploy Angel Order Handler to EC2

on:
  push:
    branches: [main]
    paths:
      - 'angel_order_handler.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host:     ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key:      ${{ secrets.EC2_KEY }}
        port:     22
        script: |
          cd /home/ubuntu
          # Pull latest from backend repo
          if [ -d "stock-yard-backend" ]; then
            cd stock-yard-backend && git pull origin main
          else
            git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/anuragsin17-sketch/Stock-Yard.git stock-yard-backend
            cd stock-yard-backend
          fi

          # Copy handler file
          cp angel_order_handler.py /home/ubuntu/angel_order_handler.py

          # Install dependencies
          pip3 install -q flask flask-cors smartapi-python pyotp requests yfinance

          # Restart service
          sudo systemctl restart angel-api || sudo pkill -f angel_order_handler || true
          sleep 2

          # Verify
          curl -s http://localhost:5000/health && echo "✅ EC2 API running" || echo "⚠️ API not responding yet"
