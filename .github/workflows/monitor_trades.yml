name: Trade Monitor - Every 30 Min (Market Hours)

on:
  schedule:
    - cron: '15,45 3 * * 1-5'
    - cron: '0,30  4 * * 1-5'
    - cron: '0,30  5 * * 1-5'
    - cron: '0,30  6 * * 1-5'
    - cron: '0,30  7 * * 1-5'
    - cron: '0,30  8 * * 1-5'
    - cron: '0,30  9 * * 1-5'
    - cron: '0     10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-trades:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install yfinance requests

    - name: Run trade monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "Running trade monitor..."
        python angel_monitor.py
        echo "Monitor completed"

    - name: Push radar_trades.json to Stock-Yard-Public
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/anuragsin17-sketch/Stock-Yard-Public.git public_repo

        cp -f radar_trades.json public_repo/radar_trades.json || true

        cd public_repo
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add radar_trades.json
        git diff --staged --quiet || git commit -m "data: radar trades update $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
        echo "✅ radar_trades.json pushed to Stock-Yard-Public"

    - name: Save state to backend repo
      run: |
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add radar_trades.json || true
        git diff --staged --quiet || git commit -m "state: trade monitor $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
