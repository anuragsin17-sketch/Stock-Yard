name: Angel One Trade Executor

on:
  repository_dispatch:
    types: [place_trade]

permissions:
  contents: write

jobs:
  execute-trade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install smartapi-python pyotp requests logzero websocket-client

    - name: Log trade request
      run: |
        echo "📊 Angel One Order Request"
        echo "Stock       : ${{ github.event.client_payload.symbol }}"
        echo "Action      : ${{ github.event.client_payload.action }}"
        echo "Entry Price : ₹${{ github.event.client_payload.price }}"
        echo "Quantity    : ${{ github.event.client_payload.quantity }}"
        echo "Time        : $(date '+%Y-%m-%d %H:%M:%S UTC')"

    - name: Execute trade on Angel One
      env:
        ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
        ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        TRADE_SYMBOL:       ${{ github.event.client_payload.symbol }}
        TRADE_ACTION:       ${{ github.event.client_payload.action }}
        TRADE_PRICE:        ${{ github.event.client_payload.price }}
        TRADE_QUANTITY:     ${{ github.event.client_payload.quantity }}
      run: python angel_trade.py

    - name: Push updated radar_trades.json to Stock-Yard-Public
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/anuragsin17-sketch/Stock-Yard-Public.git public_repo

        cp -f radar_trades.json   public_repo/radar_trades.json   || true
        cp -f angel_orders.json   public_repo/angel_orders.json   || true

        cd public_repo
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add radar_trades.json angel_orders.json
        git diff --staged --quiet || git commit -m "trade: ${{ github.event.client_payload.action }} ${{ github.event.client_payload.symbol }} $(date -u '+%H:%M UTC')"
        git push
        echo "✅ Trade data pushed to Stock-Yard-Public"

    - name: Save state to backend repo
      run: |
        git config user.name  "Stock Yard Bot"
        git config user.email "bot@stockyard.io"
        git add radar_trades.json angel_orders.json || true
        git diff --staged --quiet || git commit -m "order: ${{ github.event.client_payload.symbol }} placed"
        git push
